# This configuration belongs to the demo branch and its existing Netlify site.
[build]
  command = "pnpm --filter demo build:web"
  publish = "apps/demo/dist"

[functions]
  directory = "apps/demo/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[build.environment]
  NODE_VERSION = "24"
