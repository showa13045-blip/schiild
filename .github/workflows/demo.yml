name: Demo checks
on:
  push:
    branches: [demo]
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter demo typecheck
      - run: pnpm --filter demo test
      - run: pnpm --filter demo build:web
      - run: pnpm --filter demo exec playwright install --with-deps chromium
      - run: node apps/demo/scripts/serve.mjs &
      - run: pnpm --filter demo test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-browser-screenshots
          path: apps/demo/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: demo-static
          path: apps/demo/dist
