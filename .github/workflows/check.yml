name: Schiild checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm build:gen
      - run: pnpm build:wasm
      - run: pnpm test:wasm
      - run: pnpm test:gen-performance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 Pillow==12.3.0
      - run: python scripts/test-gen-cli.py --gen target/release/gen
      - run: pnpm --filter api build
      - run: pnpm build
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: pnpm --filter mobile build:web
        env:
          EXPO_NO_TELEMETRY: '1'
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-requirements.mjs
